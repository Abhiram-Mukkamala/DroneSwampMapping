version: '3.8'

services:
  perception:
    build:
      context: ./perception
      dockerfile: Dockerfile
    container_name: droneswarm-perception
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
